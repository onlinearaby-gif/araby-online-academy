<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <meta http-equiv="refresh" content="0; url=./#admin">
  <title>لوحة الإدارة | أكاديمية عربي أونلاين</title>
  <script>
    // Robust redirect to #admin relative to current project directory
    var target = (window.location.pathname.indexOf('.html') !== -1) 
      ? window.location.pathname.replace(/[^\/]+$/, '') + '#admin'
      : window.location.pathname.replace(/\/+$/, '') + '/#admin';
    window.location.replace(target);
  </script>
</head>

    <p style="margin-top: 20px;">
      <a href="./#admin" style="display: inline-block; padding: 10px 20px; background: #F97316; color: white; text-decoration: none; border-radius: 12px; font-weight: bold; font-size: 13px;">
        اضغط هنا إذا لم يتم نقلك تلقائياً 🚀
